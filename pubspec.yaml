name: tubes_pbp_gym
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^5.2.1
  flutter_facebook_auth: ^7.1.1
  url_launcher: ^6.0.20
  cupertino_icons: ^1.0.8
  image_picker: ^0.8.4
  font_awesome_flutter: ^10.0.0
  animated_splash_screen: ^1.3.0
  lottie: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  shared_preferences: ^2.0.6
  intl: ^0.19.0
  provider: ^6.0.0
  table_calendar: ^3.0.9
  carousel_slider: ^5.0.0
  numberpicker: ^2.1.2
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  pdf: ^3.6.0
  printing: ^5.4.0
  flutter_nfc_kit: ^3.4.2
  nfc_manager: ^3.5.0
  flutter_dotenv: ^5.0.2
  decimal: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "icons/icon_symsalagym.png"
  adaptive_icon_background: "#09060B"
  adaptive_icon_foreground: "icons/logo_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - images/
    - images/home-image/
    - images/home-image/membership/
    - images/home-image/personal-trainer/
    - images/home-image/healthy-club/
    - images/home-image/alat-gym/
    - icons/icons-home/
    - images/gym.png
    - lottie/
    - images/Payment/
